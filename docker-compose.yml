services:
  php-apache-proyecto:
    build: ./app
    container_name: php-apache-proyecto
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql-proyecto

  mysql-proyecto:
    image: mysql:8.0
    container_name: mysql-proyecto
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin-proyecto:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-proyecto
    restart: unless-stopped
    depends_on:
      - mysql-proyecto
    environment:
      PMA_HOST: mysql-proyecto
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      PMA_USER: Pruebas
      PMA_PASSWORD: Pruebas123
    ports:
      - "8083:80"

volumes:
  db_data:
    external: true
    name: sc502-ln-proyecto-grupo-3-2_db_data