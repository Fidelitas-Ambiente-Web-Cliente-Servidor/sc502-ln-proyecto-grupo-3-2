<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agendamiento de citas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Agendamiento de citas</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="../php/actividades.php">Ver actividades</a>
        </nav>
    </header>

    <main>
        <section class="bloque">
            <h2>Nueva cita</h2>

            <form id="form-cita" action="../php/citas.php" method="POST">
                <div class="campo">
                    <label for="adulto_id">Adulto mayor</label>

                    <select id="adulto_id" name="adulto_id" required>
                        <option value="">Cargando adultos mayores...</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="campo">
                    <label for="hora">Hora</label>
                    <input type="time" id="hora" name="hora" required>
                </div>

                <div class="campo">
                    <label for="motivo">Motivo de la visita</label>
                    <textarea id="motivo" name="motivo" rows="3" required></textarea>
                </div>

                <button type="submit">Agendar cita</button>
            </form>
        </section>

        <section class="bloque">
            <h2>Mis citas</h2>

            <div id="contenedorMisCitas">
                <p>Cargando citas...</p>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/citas.js"></script>
</body>
</html>
