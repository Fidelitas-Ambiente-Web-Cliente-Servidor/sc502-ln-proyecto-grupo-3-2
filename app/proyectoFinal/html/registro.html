<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Centro Diurno Vida Activa</h1>
        <nav>
            <a href="login.html">Ir al Login</a>
            <a href="index.html">Inicio</a>
        </nav>
    </header>

    <main>
        <section class="bloque">
            <h2>Crear Cuenta Nueva</h2>

            <form action="../php/procesar_registro.php" method="POST" id="form-registro">
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono (opcional)</label>
                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        autocomplete="tel"
                    >
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

        
                <button type="submit">Registrar Usuario</button>
            </form>
        </section>
    </main>

    <script src="../js/registro-validacion.js"></script>
</body>
</html>
